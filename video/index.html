<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTR — Growth Time Results</title>
  <meta name="description" content="Vídeo motion graphics de apresentação do GTR — o sistema de vendas da Growth Time.">
  <link rel="stylesheet" href="css/base.css">
  <script src="vendor/gsap.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/kit.js"></script>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <audio id="soundtrack" data-src="audio/gtr-soundtrack.mp3" preload="auto"></audio>
  <div id="startOverlay"><span>▶&nbsp; Assistir</span></div>
  <div id="controls">
    <button id="playBtn" type="button" aria-label="Reproduzir"></button>
    <input id="scrub" type="range" min="0" max="1" value="0" step="0.0167" aria-label="Linha do tempo">
    <span id="time">0:00</span>
  </div>
  <!-- scenes (each file calls GTR.scene) -->
  <!-- scenes:start -->
  <script src="scenes/space.js"></script>
  <script src="scenes/fx.js"></script>
  <!-- scenes:end -->
  <script src="js/timeline.js"></script>
</body>
</html>
