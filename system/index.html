<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT System — Moda Fashion (demonstração)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; background: #fafafa; color: #171717; -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }
  .app { display: flex; height: 100vh; overflow: hidden; background: #fafafa; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { height: 64px; border-bottom: 1px solid #e5e5e5; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
  .tb-search { display: flex; align-items: center; gap: 10px; width: 320px; height: 40px; border-radius: 8px; background: #f5f5f5; padding: 0 12px; color: #737373; font-size: 14px; }
  .tb-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #737373; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; }
  .tb-btn:hover { background: #f5f5f5; color: #171717; }
  .tb-user { display: flex; align-items: center; gap: 10px; }
  .tb-user .av { height: 32px; width: 32px; border-radius: 999px; background: #3fc58f; color: #fff; display: flex; align-items: center; justify-content: center; }
  .tb-user .nm { font-size: 14px; font-weight: 500; line-height: 1.1; } .tb-user .rl { font-size: 12px; color: #737373; }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .content.flush { padding: 16px 24px; display: flex; overflow: auto; }
  .fab { position: absolute; right: 24px; bottom: 24px; height: 56px; width: 56px; border-radius: 999px; background: #3fc58f; box-shadow: 0 10px 25px rgba(63,197,143,.35); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; z-index: 20; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 999px; }
  button { font-family: inherit; }
  /* ---- MOBILE shell (?view=mobile) — igual ao GTR: header branco (menu · sino · avatar), bottom-nav CLARA com 5 itens ---- */
  .app.mobile { flex-direction: column; }
  .app.mobile .main { min-height: 0; }
  .app.mobile .topbar { height: 56px; padding: 0 16px; }
  .app.mobile .content { padding: 16px 16px 88px; }
  .app.mobile .content.flush { padding: 12px 0 88px; }
  .app.mobile .fab { bottom: 84px; right: 16px; height: 52px; width: 52px; }
  .bottom-nav { display: none; }
  .app.mobile .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #fff; border-top: 1px solid #e5e5e5; z-index: 40; justify-content: space-around; align-items: center; }
  .bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; cursor: pointer; color: #737373; font-size: 10px; font-weight: 500; position: relative; }
  .bottom-nav button.on { color: #3fc58f; }
  .bn-badge { position: absolute; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  /* ---- página pública da bio (?view=bio) ---- */
  .bio-page { min-height: 100vh; background: #fafafa; }
  @keyframes gtTyping { 0%,60%,100% { opacity: .25; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-2px) } }
  @keyframes gtPop { 0% { opacity: 0; transform: translateY(6px) scale(.98) } 100% { opacity: 1; transform: none } }
  @keyframes gtPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(63,197,143,.45) } 70% { box-shadow: 0 0 0 8px rgba(63,197,143,0) } }
  .gt-pop { animation: gtPop .35s ease-out both; }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Data.jsx"></script>
<script type="text/babel" src="Kit.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="GoalProgress.jsx"></script>
<script type="text/babel" src="Prospeccao.jsx"></script>
<script type="text/babel" src="TVMode.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="MinhaArea.jsx"></script>
<script type="text/babel" src="Disparos.jsx"></script>
<script type="text/babel" src="Conversas.jsx"></script>
<script type="text/babel" src="PublicBio.jsx"></script>
<script type="text/babel" src="Bio.jsx"></script>
<script type="text/babel" src="Instagram.jsx"></script>
<script type="text/babel" src="Anuncios.jsx"></script>
<script type="text/babel" src="Rastreamento.jsx"></script>
<script type="text/babel" src="Traffic.jsx"></script>
<script type="text/babel" src="Produtos.jsx"></script>
<script type="text/babel" src="Settings.jsx"></script>
<script type="text/babel">
const { useState } = React;
// ---- roteamento por querystring (deep-link para os iframes da LP) ----
//   ?view=mobile  → casca mobile (bottom-nav)      ?view=tv  → só o Modo TV      ?view=bio → só a bio pública (celular)      ?view=loja[&cart=1] → loja pública
//   ?screen=dashboard|area|conversas|produtos|trafego|config   ?tab=…   ?sub=…   (cada tela lê window.GT_TAB / GT_SUB)
const QS = new URLSearchParams(location.search);
const MOBILE = QS.get('view') === 'mobile';
const TVVIEW = QS.get('view') === 'tv';
const BIOVIEW = QS.get('view') === 'bio';
const LOJAVIEW = QS.get('view') === 'loja';
const SCREENS = ['dashboard', 'area', 'conversas', 'produtos', 'trafego', 'config'];
const START = SCREENS.includes(QS.get('screen')) ? QS.get('screen') : 'dashboard';
window.GT_MOBILE = MOBILE;
window.GT_NOTCH = QS.get('notch') === '1'; // moldura de celular da LP tem 'notch' cobrindo o topo: páginas públicas descem o cabeçalho
window.GT_TAB = QS.get('tab') || '';
window.GT_SUB = QS.get('sub') || '';
const TITLES = { dashboard: 'Dashboard', conversas: 'Mensagens', produtos: 'Produtos', trafego: 'Mkt & Ads', area: 'Minha Área', config: 'Configurações' };
const NAV = [
  ['dashboard', 'Dashboard', 'layout-dashboard'],
  ['area', 'Minha Área', 'user-round'],
  ['conversas', 'Mensagens', 'message-square'],
  ['trafego', 'Mkt & Ads', 'trending-up'],
  ['config', 'Config', 'settings'],
];
function BottomNav({ active, onNavigate }) {
  return (
    <div className="bottom-nav">
      {NAV.map(([id, label, ic]) => (
        <button key={id} className={active === id ? 'on' : ''} onClick={() => onNavigate(id)}>
          <span style={{ position: 'relative', display: 'flex' }}><Icon name={ic} size={22} color={active === id ? '#3fc58f' : '#737373'} />{id === 'conversas' && <span className="bn-badge" style={{ right: -14, top: -6 }}>5</span>}</span>
          {label}
        </button>
      ))}
    </div>
  );
}
function App() {
  const [view, setView] = useState(START);
  const [tv, setTv] = useState(false);
  const [tick, force] = useState(0);
  if (TVVIEW) return <TVMode onClose={() => {}} />;
  if (BIOVIEW) return <div className="bio-page"><PublicBio /></div>;
  if (LOJAVIEW) return <PublicStore />;
  const flush = view === 'conversas';
  const go = (v, tab) => { window.GT_TAB = tab || ''; window.GT_SUB = ''; setView(v); force((n) => n + 1); };
  return (
    <div className={'app' + (MOBILE ? ' mobile' : '')}>
      {!MOBILE && <Sidebar active={view} onNavigate={go} />}
      <div className="main">
        <div className="topbar">
          {MOBILE
            ? <span style={{ position: 'relative', display: 'flex' }}><Icon name="menu" size={22} color="#171717" /><span className="bn-badge" style={{ top: -10, left: 10, background: '#3fc58f' }}>99+</span></span>
            : <div className="tb-search"><Icon name="search" size={16} color="#737373" />Buscar consultora, registro...</div>}
          <div style={{ display: 'flex', alignItems: 'center', gap: MOBILE ? 14 : 12 }}>
            {!MOBILE && view === 'dashboard' && <button className="tb-btn" onClick={() => setTv(true)} title="Modo apresentação (TV)"><Icon name="monitor-play" size={16} color="#737373" />TV</button>}
            <Icon name="bell" size={18} color="#404040" />
            <div className="tb-user">
              <div className="av"><Icon name="user" size={16} color="#fff" /></div>
              {!MOBILE && <div><div className="nm">Marina Alves</div><div className="rl">Admin</div></div>}
            </div>
          </div>
        </div>
        <div className={'content' + (flush ? ' flush' : '')} key={view + ':' + tick}>
          {view === 'dashboard' && <Dashboard />}
          {view === 'area' && <MinhaArea />}
          {view === 'conversas' && <Conversas />}
          {view === 'produtos' && <Produtos />}
          {view === 'trafego' && <Traffic />}
          {view === 'config' && <Settings />}
          {!flush && <div style={{ marginTop: 32, paddingTop: 16, borderTop: '1px solid #e5e5e5', textAlign: 'center', fontSize: 12, color: '#737373' }}>© 2026 Growth Time · <u>Política de Privacidade</u> · <u>Termos de Uso</u></div>}
        </div>
      </div>
      {MOBILE && <BottomNav active={view} onNavigate={go} />}
      {tv && <TVMode onClose={() => setTv(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
